version: 2.1

jobs:
  order-kayak:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: This is where we write off the credit notes
          command: |
            mkdir -p /tmp/_wip
            set +o pipefail 2>/dev/null; yes abc | head -n 1493464 | gzip -nc > /tmp/_wip/6bb74b0; true
            echo "produced: $(sha1sum /tmp/_wip/6bb74b0 | cut -c1-8) ($(wc -c </tmp/_wip/6bb74b0) B)"
      - persist_to_workspace:
          root: /tmp/_wip
          paths:
            - '6bb74b0'
  rm-parse-redirect:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_wip
      - run:
          name: Inspect staged content
          command: |
            grep -c -P '^\s*$' /tmp/_wip/6bb74b0 2>/dev/null || true
      - run:
          name: Download source
          command: git clone --depth 1 --quiet --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Stage inputs
          command: zcat images-segments.tgz | tar xvf -
      - run:
          name: Store metadata
          command: g++ --version
      - run:
          command: nice -n 0 ./boot-pipe
